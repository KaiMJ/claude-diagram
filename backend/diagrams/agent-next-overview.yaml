annotations:
  - id: ann_ai_boundary
    type: warning
    message: "CLAUDE.md says never import from modules/ai/. 20 import lines in 15 files do (AiModule, usage tracking, escalation, platform-kb, migration status, whisper). ai/ also imports agent-next.purposes, so the two modules are coupled both ways."
    targetId: plat_classic_ai
    targetType: node

  - id: ann_layers
    type: idea
    message: "harness/ and surface/ were the planned split so the engine is swappable. Today everything sits in arena/: swapping Mastra means editing arena/mastra + services."
    targetId: planned_harness
    targetType: node

  - id: ann_chat_import
    type: warning
    message: "chat-import ↔ arena import each other (chat-import uses arena repos/services; ArenaModule hosts its providers). chat-import.service.ts copies COFOUNDER_DEFAULT_HARNESS to avoid a cycle."
    targetId: chat_import
    targetType: node

  - id: ann_decisions
    type: todo
    message: "Only D16 has a decision file. D1–D12 still proposed/open in CLAUDE.md (dated 2026-10-26)."
    targetId: doc_decisions
    targetType: node
