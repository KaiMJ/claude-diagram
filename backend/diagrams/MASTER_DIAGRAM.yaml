# =============================================================================
# Architecture Diagrams Manifest
# =============================================================================
# This manifest tracks all architecture diagrams, their scope, and relationships.
# All diagrams are stored as YAML files in diagrams/{slug}.yaml
# =============================================================================

categories:
  - id: overview
    label: Overview
    description: High-level system diagrams showing end-to-end flows
    icon: "🏠"

  - id: backend
    label: Backend
    description: Backend modules and services
    icon: "⚙️"

  - id: frontend
    label: Frontend
    description: Frontend modules and components
    icon: "🖥️"

# =============================================================================
# DIAGRAMS
# =============================================================================

diagrams:
  # ---------------------------------------------------------------------------
  # Overview
  # ---------------------------------------------------------------------------
  - slug: system-overview
    title: System Overview
    category: overview
    icon: "🏗️"
    description: Complete data pipeline from external APIs to query layer

  - slug: medallion
    title: Medallion Architecture
    category: overview
    icon: "🥇"
    description: Bronze → Silver → Gold data transformation pipeline

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  - slug: scheduler-architecture
    title: Scheduler Architecture
    category: backend
    icon: "📅"
    description: 6-layer stack for Amazon report scheduling with pipeline model
    focus: Report scheduling, pipeline execution, rate limiting, token management
    entry_points:
      - backend/src/scheduler/
      - backend/src/platforms/amazon/
    core_files:
      - backend/src/scheduler/api.py
      - backend/src/scheduler/operations/*.py
      - backend/src/scheduler/pipeline/*.py
      - backend/src/platforms/amazon/http/*.py
      - backend/src/platforms/amazon/auth/*.py
    connections:
      - medallion
      - auth-module

  - slug: auth-module
    title: Auth Module
    category: backend
    icon: "🔐"
    description: Authentication, OAuth, and account management
