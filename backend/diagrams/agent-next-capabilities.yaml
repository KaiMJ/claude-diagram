annotations:
  - id: ann_no_arena
    type: idea
    message: "capabilities/ never imports arena/ (checked): the CLAUDE.md layering rule holds. Its only agent-next dependency outside itself is cofounder-media's storage client."
    targetId: cap_module
    targetType: node

  - id: ann_classic_drift
    type: warning
    message: "Cloned from Classic ai/tools/medusa (D2). Classic fixes made after the clone are not all ported; no automated diff between the two copies."
    targetId: medusa_client
    targetType: node

  - id: ann_ai_imports
    type: warning
    message: "Imports Classic modules/ai despite the boundary rule (images, docs, escalation, migration, AiModule)."
    targetId: plat_classic_ai
    targetType: node

  - id: ann_counts
    type: todo
    message: "28 of 238 registry tools are named dynamically and not attributed to a folder in this diagram; per-family counts are a lower bound."
    targetId: registry
    targetType: node
